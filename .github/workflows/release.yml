name: Release Platform Packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        default: v0.1.21
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      release_body: ${{ steps.release_notes.outputs.body }}
      tag_name: ${{ steps.release_metadata.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Resolve release metadata
        id: release_metadata
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Generate release notes
        id: release_notes
        env:
          TAG_NAME: ${{ steps.release_metadata.outputs.tag_name }}
          VERSION: ${{ steps.release_metadata.outputs.version }}
        run: |
          cat > release_body.md << 'EOF'
          # Ivenn Inventory Vault __VERSION__

          ## Installation

          ### Windows
          Download `Ivenn___VERSION___x64-setup.exe` and run the installer.
          - Requires Windows 10 or later
          - WebView2 is included or auto-installed

          ### macOS
          Download `Ivenn___VERSION___x64.dmg` and open it.
          - Drag Ivenn to Applications folder
          - Requires macOS 10.15 or later

          ### Linux
          Download the `.AppImage` for your architecture:
          - Mark it executable: `chmod +x Ivenn___VERSION___x64.AppImage`
          - Run it: `./Ivenn___VERSION___x64.AppImage`

          **System Requirements:**
          - WebKitGTK 4.1+: `sudo apt-get install libwebkit2gtk-4.1-0`
          - Optional OCR: `sudo apt-get install tesseract-ocr`

          ## What's Changed

          This is a new release. See [commits](https://github.com/${{ github.repository }}/commits/__VERSION__) for details.

          ## Security & Privacy

          - All data is stored locally on your device
          - No telemetry or data collection
          - No internet connection required to use the app
          EOF
          sed -i "s/__VERSION__/${VERSION}/g" release_body.md
          body=$(cat release_body.md | jq -Rs .)
          echo "body=${body}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_metadata.outputs.tag_name }}
          name: Ivenn ${{ steps.release_metadata.outputs.version }}
          draft: true
          prerelease: ${{ contains(steps.release_metadata.outputs.tag_name, 'alpha') || contains(steps.release_metadata.outputs.tag_name, 'beta') }}
          body: ${{ steps.release_notes.outputs.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  package:
    name: Package ${{ matrix.platform }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            artifact_name: inventory-vault-windows
            build_args: ""
          - platform: linux
            os: ubuntu-latest
            artifact_name: inventory-vault-linux
            build_args: ""
          - platform: macos
            os: macos-latest
            artifact_name: inventory-vault-macos
            build_args: ""
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            tesseract-ocr \
            tesseract-ocr-eng

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install create-dmg

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          npm ci --prefix desktop

      - name: Run backend tests
        run: python -m pytest -q

      - name: Setup code signing (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "⚠️ Skipping macOS signing - certificate not configured"
            exit 0
          fi
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$MACOS_CERTIFICATE_PWD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$MACOS_CERTIFICATE_PWD" build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_CERTIFICATE_PWD" build.keychain

      - name: Setup code signing (Windows)
        if: runner.os == 'Windows'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PWD: ${{ secrets.WINDOWS_CERTIFICATE_PWD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            Write-Output "⚠️ Skipping Windows signing - certificate not configured"
            exit 0
          }
          $CertBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          [IO.File]::WriteAllBytes((Join-Path $PWD "certificate.pfx"), $CertBytes)
          # Windows signing configuration would be set in tauri.conf.json

      - name: Build native package
        working-directory: desktop
        run: npm run tauri -- build
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}

      - name: Get build artifacts
        id: artifacts
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "files=desktop/src-tauri/target/release/bundle/msi/*" >> $GITHUB_OUTPUT
          elif [ "${{ runner.os }}" = "macOS" ]; then
            echo "files=desktop/src-tauri/target/release/bundle/dmg/*" >> $GITHUB_OUTPUT
          else
            echo "files=desktop/src-tauri/target/release/bundle/appimage/*" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: ${{ steps.artifacts.outputs.files }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact for retention
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: desktop/src-tauri/target/release/bundle/**
          retention-days: 14

  finalize-release:
    name: Finalize Release
    needs: [create-release, package]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Publish release after all platform builds pass
        if: needs.package.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.create-release.outputs.tag_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false
      - name: Keep release as draft after a platform failure
        if: needs.package.result != 'success'
        run: echo "A platform build failed. The release remains a draft for investigation."
