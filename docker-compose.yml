services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
      POSTGRES_DB: inventory_vault
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory_vault"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8001}:8000"
    volumes:
      - ./app:/code/app
      - ./data:/code/data
    environment:
      DATABASE_URL: postgresql+psycopg://inventory:inventory@db:5432/inventory_vault
      STORAGE_DIR: /code/data/uploads

volumes:
  db_data:
