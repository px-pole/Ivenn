[project]
name = "inventory-vault"
version = "0.1.0"
description = "Household Inventory & Warranty Vault"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "sqlalchemy>=2.0.52",
    "alembic>=1.19",
    "psycopg[binary]>=3.3",
    "pydantic-settings>=2.15",
    "python-multipart>=0.0.32",
    "reportlab>=4.4",
    "bcrypt>=5.0",
    "pyjwt>=2.13",
    "pydantic[email]>=2.13",
    "pytesseract>=0.3.13",
    "pillow>=12.0",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "httpx>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
